<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>Timer</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-state="idle">

  <main class="stage">

    <div class="dial">
      <svg class="ring" viewBox="0 0 300 300" aria-hidden="true">
        <circle class="ring-track" cx="150" cy="150" r="140"></circle>
        <circle class="ring-progress" cx="150" cy="150" r="140"></circle>
      </svg>

      <div class="readout">
        <div class="number" id="number">0</div>
        <div class="subtime" id="subtime"></div>
      </div>

      <input class="ghost-input" id="ghost" type="text" inputmode="numeric" pattern="[0-9]*"
             autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Seconds">
    </div>

    <div class="wheel" id="wheel">
      <div class="wheel-scroll" id="wheelScroll">
        <div class="wheel-pad"></div>
        <div class="wheel-items" id="wheelItems"></div>
        <div class="wheel-pad"></div>
      </div>
      <div class="wheel-rules" aria-hidden="true"></div>
      <div class="wheel-label" aria-hidden="true">seconds</div>
    </div>

    <div class="buttons">
      <button class="btn btn-grey" id="leftBtn" type="button">Cancel</button>
      <button class="btn btn-orange" id="rightBtn" type="button">Start</button>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
